<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if site.draft %}<meta name="robots" content="noindex, nofollow">{% endif %}
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  {% if site.draft %}<div class="draft-banner">Draft – work in progress. This website is not public yet.</div>{% endif %}
  {% include header.html %}
  <main id="content" class="{{ page.layout }}">
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    // Opens/closes the menu on small screens
    document.querySelector('.menu-toggle').addEventListener('click', function () {
      var open = document.body.classList.toggle('menu-open');
      this.setAttribute('aria-expanded', open);
    });
  </script>
</body>
</html>
